name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          always-auth: true

      - name: Determine release state
        id: determine
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"

          if ! [[ "$CURRENT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Cannot publish '$CURRENT_VERSION' as a stable release" >&2
            exit 1
          fi
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            PREVIOUS_VERSION=$(node -e "const { execSync } = require('node:child_process'); try { const data = execSync('git show HEAD^:package.json', { stdio: ['ignore', 'pipe', 'ignore'] }); const json = JSON.parse(data.toString()); if (json && typeof json.version === 'string') { process.stdout.write(json.version); } } catch (error) {}")
            PREVIOUS_VERSION=${PREVIOUS_VERSION//$'\n'/}
          else
            PREVIOUS_VERSION=""
          fi
          echo "previous_version=$PREVIOUS_VERSION" >> "$GITHUB_OUTPUT"
          git fetch origin --tags
          TAG_EXISTS=false
          if git show-ref --verify --quiet "refs/tags/v$CURRENT_VERSION"; then
            TAG_EXISTS=true
            echo "tag_commit=$(git rev-parse "refs/tags/v$CURRENT_VERSION^{commit}")" >> "$GITHUB_OUTPUT"
          fi
          echo "tag_exists=$TAG_EXISTS" >> "$GITHUB_OUTPUT"

          # Only a registry 404 means the version is unpublished. Auth/network
          # errors must fail the job, rather than accidentally permit a publish.
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          echo "package_name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          NPM_BODY=$(mktemp)
          NPM_STATUS=$(curl --silent --show-error --retry 3 --connect-timeout 10 --max-time 30 \
            --output "$NPM_BODY" --write-out '%{http_code}' \
            "https://registry.npmjs.org/$PACKAGE_NAME/$CURRENT_VERSION")
          case "$NPM_STATUS" in
            200)
              node -e 'const fs = require("node:fs"); const p = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); if (p.name !== process.argv[2] || p.version !== process.argv[3]) process.exit(1)' \
                "$NPM_BODY" "$PACKAGE_NAME" "$CURRENT_VERSION"
              NPM_EXISTS=true ;;
            404) NPM_EXISTS=false ;;
            *) echo "ERROR: npm registry lookup failed (HTTP $NPM_STATUS)" >&2; exit 1 ;;
          esac

          RELEASE_BODY=$(mktemp)
          RELEASE_STATUS=$(curl --silent --show-error --retry 3 --connect-timeout 10 --max-time 30 \
            --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' \
            --output "$RELEASE_BODY" --write-out '%{http_code}' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/v$CURRENT_VERSION")
          case "$RELEASE_STATUS" in
            200)
              node -e 'const fs = require("node:fs"); const r = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); if (r.tag_name !== process.argv[2] || r.draft !== false) process.exit(1)' \
                "$RELEASE_BODY" "v$CURRENT_VERSION"
              RELEASE_EXISTS=true ;;
            404) RELEASE_EXISTS=false ;;
            *) echo "ERROR: GitHub release lookup failed (HTTP $RELEASE_STATUS)" >&2; exit 1 ;;
          esac

          ELIGIBLE=false
          if [ "$CURRENT_VERSION" != "$PREVIOUS_VERSION" ] || [ "$TAG_EXISTS" = true ] || [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            ELIGIBLE=true
          fi
          NEEDS_PUBLISH=false
          NEEDS_RELEASE=false
          if [ "$ELIGIBLE" = true ]; then
            [ "$NPM_EXISTS" = true ] || NEEDS_PUBLISH=true
            [ "$RELEASE_EXISTS" = true ] || NEEDS_RELEASE=true
            if [ "$TAG_EXISTS" = false ] && { [ "$NPM_EXISTS" = true ] || [ "$RELEASE_EXISTS" = true ]; }; then
              echo "ERROR: Release exists without its source tag; refusing to recreate it" >&2
              exit 1
            fi
          fi
          echo "needs_publish=$NEEDS_PUBLISH" >> "$GITHUB_OUTPUT"
          echo "needs_release=$NEEDS_RELEASE" >> "$GITHUB_OUTPUT"
          {
            echo "### Release v$CURRENT_VERSION"
            echo "- npm version exists: $NPM_EXISTS"
            echo "- Git tag exists: $TAG_EXISTS"
            echo "- GitHub release exists: $RELEASE_EXISTS"
            echo "- Publish needed: $NEEDS_PUBLISH"
            echo "- GitHub release needed: $NEEDS_RELEASE"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify workflow source
        if: steps.determine.outputs.needs_publish == 'true'
        run: |
          set -euo pipefail
          # npm verifies provenance against the immutable GitHub OIDC identity.
          # Build that commit and never override GITHUB_SHA or GITHUB_REF.
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code --quiet HEAD

      - name: Verify NPM token
        if: steps.determine.outputs.needs_publish == 'true'
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "NPM_TOKEN secret is required" >&2
            exit 1
          fi
          npm whoami --registry https://registry.npmjs.org
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install dependencies
        if: steps.determine.outputs.needs_publish == 'true'
        run: npm ci

      - name: Run Tests
        if: steps.determine.outputs.needs_publish == 'true'
        run: npm test

      - name: Build
        if: steps.determine.outputs.needs_publish == 'true'
        run: |
          rm -rf -- dist
          npm run build

      - name: Verify build artifacts
        if: steps.determine.outputs.needs_publish == 'true'
        run: |
          set -euo pipefail
          [ -f dist/index.js ] || { echo "dist/index.js missing" >&2; exit 1; }
          [ -f dist/index.d.ts ] || { echo "dist/index.d.ts missing" >&2; exit 1; }
          [ -d dist/src ] || { echo "dist/src/ missing" >&2; exit 1; }

      - name: Pack release
        if: steps.determine.outputs.needs_publish == 'true'
        id: package
        env:
          CURRENT_VERSION: ${{ steps.determine.outputs.current_version }}
          PACKAGE_NAME: ${{ steps.determine.outputs.package_name }}
        run: |
          set -euo pipefail
          PACKAGE_DIR=$(mktemp -d)
          npm pack --ignore-scripts --json --pack-destination "$PACKAGE_DIR" > "$PACKAGE_DIR/pack.json"
          TARBALL=$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))[0].filename' "$PACKAGE_DIR/pack.json")
          tar -xOf "$PACKAGE_DIR/$TARBALL" package/package.json | node -e '
            const fs = require("node:fs")
            const p = JSON.parse(fs.readFileSync(0, "utf8"))
            const repository = "git+https://github.com/" + process.env.GITHUB_REPOSITORY + ".git"
            if (p.name !== process.env.PACKAGE_NAME || p.version !== process.env.CURRENT_VERSION || p.repository?.url !== repository) {
              throw new Error("Packed name/version/repository does not match release")
            }
          '
          echo "tarball=$PACKAGE_DIR/$TARBALL" >> "$GITHUB_OUTPUT"

      - name: Verify package matches existing tag
        if: steps.determine.outputs.needs_publish == 'true' && steps.determine.outputs.tag_exists == 'true'
        env:
          CURRENT_VERSION: ${{ steps.determine.outputs.current_version }}
          PACKAGE_NAME: ${{ steps.determine.outputs.package_name }}
          PACKED_TARBALL: ${{ steps.package.outputs.tarball }}
          REFERENCE_COMMIT: ${{ steps.determine.outputs.tag_commit }}
        run: |
          set -euo pipefail
          REFERENCE_DIR=$(mktemp -d)
          mkdir "$REFERENCE_DIR/source"
          git archive "$REFERENCE_COMMIT" | tar -x -C "$REFERENCE_DIR/source"
          (
            cd "$REFERENCE_DIR/source"
            node -e 'const p = require("./package.json"); if (p.name !== process.env.PACKAGE_NAME || p.version !== process.env.CURRENT_VERSION) throw new Error("Release tag package name/version does not match")'
            npm ci
            rm -rf -- dist
            npm run build
            npm pack --ignore-scripts --json --pack-destination "$REFERENCE_DIR" > "$REFERENCE_DIR/pack.json"
          )
          REFERENCE_TARBALL=$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))[0].filename' "$REFERENCE_DIR/pack.json")
          if ! cmp --silent "$PACKED_TARBALL" "$REFERENCE_DIR/$REFERENCE_TARBALL"; then
            echo "ERROR: Package differs from existing tag; bump the version instead of replacing its contents" >&2
            exit 1
          fi
          {
            echo "Package at $GITHUB_SHA is byte-identical to v$CURRENT_VERSION ($REFERENCE_COMMIT)"
            echo "SHA-512: $(sha512sum "$PACKED_TARBALL" | cut -d ' ' -f 1)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create source tag
        if: steps.determine.outputs.needs_publish == 'true' && steps.determine.outputs.tag_exists == 'false'
        env:
          CURRENT_VERSION: ${{ steps.determine.outputs.current_version }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git tag "v$CURRENT_VERSION"
          git push origin "v$CURRENT_VERSION"

      - name: Publish to npm
        if: steps.determine.outputs.needs_publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          CURRENT_VERSION: ${{ steps.determine.outputs.current_version }}
          PACKAGE_NAME: ${{ steps.determine.outputs.package_name }}
          PACKED_TARBALL: ${{ steps.package.outputs.tarball }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code --quiet HEAD
          npm publish "$PACKED_TARBALL" --access public --provenance
          npm view "$PACKAGE_NAME@$CURRENT_VERSION" version --registry https://registry.npmjs.org --prefer-online
          echo "Published $PACKAGE_NAME@$CURRENT_VERSION to npm" >> "$GITHUB_STEP_SUMMARY"

      - name: Generate release notes
        if: steps.determine.outputs.needs_release == 'true'
        id: release_notes
        run: |
          set -euo pipefail
          CURRENT_VERSION="${{ steps.determine.outputs.current_version }}"
          PREVIOUS_VERSION="${{ steps.determine.outputs.previous_version }}"
          RELEASE_COMMIT=$(git rev-parse "refs/tags/v$CURRENT_VERSION^{commit}")
          RANGE=""
          COMPARE_URL=""
          LAST_TAG=$(git describe --tags --abbrev=0 "$RELEASE_COMMIT^" 2>/dev/null || true)
          if [ -z "$LAST_TAG" ] && [ -n "$PREVIOUS_VERSION" ] && git rev-parse "refs/tags/v${PREVIOUS_VERSION}" >/dev/null 2>&1; then
            LAST_TAG="v${PREVIOUS_VERSION}"
          fi
          if [ -n "$LAST_TAG" ]; then
            RANGE="${LAST_TAG}..${RELEASE_COMMIT}"
            COMPARE_URL="https://github.com/${GITHUB_REPOSITORY}/compare/${LAST_TAG}...v${CURRENT_VERSION}"
          fi
          if [ -n "$RANGE" ]; then
            CHANGELOG=$(git log --no-merges --pretty=format:'- %s (%h)' "$RANGE")
          else
            CHANGELOG=$(git log --no-merges --pretty=format:'- %s (%h)' "$RELEASE_COMMIT")
          fi
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="- No commits found for this release."
          fi
          BODY_FILE=$(mktemp)
          {
            echo "## Release v${CURRENT_VERSION}"
            echo ""
            if [ -n "$COMPARE_URL" ]; then
              echo "Compare changes: $COMPARE_URL"
              echo ""
            fi
            printf "%s\n" "$CHANGELOG"
            echo ""
            echo "### Upgrade"
            echo ""
            echo "Update your \`opencode.json\`:"
            echo ""
            printf '%s\n' '```json'
            printf '%s\n' '{'
            printf '%s\n' "  \"plugins\": [\"opencode-antigravity-auth@${CURRENT_VERSION}\"]"
            printf '%s\n' '}'
            printf '%s\n' '```'
            echo ""
            echo "If stuck on an old version, clear the cache:"
            echo ""
            printf '%s\n' '```bash'
            printf '%s\n' 'rm -rf ~/.cache/opencode/node_modules ~/.cache/opencode/bun.lock'
            printf '%s\n' '```'

          } >"$BODY_FILE"
          cat "$BODY_FILE"
          {
            echo "body<<EOF"
            cat "$BODY_FILE"
            echo "EOF"
          } >>"$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: steps.determine.outputs.needs_release == 'true'
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.determine.outputs.current_version }}
          release_name: v${{ steps.determine.outputs.current_version }}
          body: ${{ steps.release_notes.outputs.body }}
          generate_release_notes: false
